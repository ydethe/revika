services:
  kubo:
    image: ipfs/kubo:latest
    container_name: kubo
    restart: unless-stopped
    volumes:
      - kubo_data:/data/ipfs
      - kubo_export:/export
    environment:
      IPFS_PROFILE: server
    ports:
      - "4001:4001"     # P2P
      - "127.0.0.1:5001:5001"     # API
      - "8080:8080"     # Gateway
    command: ["daemon"]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  kubo_data:
  kubo_export:
