name: E2E

on:
  push:
  pull_request:

jobs:
  # Hermetic, Docker-free E2E: the real adapter + smoke-client binaries run as separate
  # processes against a pure-Go stub Kubo. No public-network egress. Runs on every push.
  e2e-stub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run stubbed E2E
        run: ./scripts/e2e.sh

  # Fidelity E2E: the same smoke clients and adapter against a REAL Kubo node, forced fully
  # offline (no DHT / bootstrap / public dials) via the CI compose overlay.
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level so every step (up, logs, down) can interpolate the compose `:?`-required var;
    # scoping it to only the `up` step made the `down -v` teardown fail interpolation.
    env:
      REVIKA_ADAPTER_SECRET: e2e-docker-shared-secret
    steps:
      - uses: actions/checkout@v4
      - name: Run docker-compose E2E against offline Kubo
        working-directory: deploy/ipfs
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          # Bring up only the long-running backend; the two clients are one-shot and run
          # below via `run`, since `up --abort-on-container-exit` kills every container the
          # instant the FASTER one-shot client exits, truncating the slower one mid-run.
          ${COMPOSE} up --build -d kubo adapter
          client_status=0
          # No --rm: keep the exited containers around so the logs step below can inspect them.
          ${COMPOSE} run --build --name client client || client_status=$?
          client_ns_status=0
          ${COMPOSE} run --build --name client-ns client-ns || client_ns_status=$?
          echo "client exited with ${client_status}"
          echo "client-ns exited with ${client_ns_status}"
          overall_status=0
          [ "${client_status}" = "0" ] || overall_status=1
          [ "${client_ns_status}" = "0" ] || overall_status=1
          exit "${overall_status}"
      - name: Dump logs on failure
        if: failure()
        working-directory: deploy/ipfs
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
      - name: Tear down
        if: always()
        working-directory: deploy/ipfs
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
