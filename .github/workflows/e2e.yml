name: E2E

on:
  push:
  pull_request:

jobs:
  # Hermetic, Docker-free E2E: the real adapter + smoke-client binaries run as separate
  # processes against a pure-Go stub Kubo. No public-network egress. Runs on every push.
  e2e-stub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run stubbed E2E
        run: ./scripts/e2e.sh

  # Fidelity E2E: the same smoke clients and adapter against a REAL Kubo node, forced fully
  # offline (no DHT / bootstrap / public dials) via the CI compose overlay.
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level so every step (up, logs, down) can interpolate the compose `:?`-required var;
    # scoping it to only the `up` step made the `down -v` teardown fail interpolation.
    env:
      REVIKA_ADAPTER_SECRET: e2e-docker-shared-secret
    steps:
      - uses: actions/checkout@v4
      - name: Run docker-compose E2E against offline Kubo
        working-directory: deploy/ipfs
        run: |
          set -euo pipefail
          docker compose \
            -f docker-compose.yml -f docker-compose.ci.yml \
            up --build --abort-on-container-exit
          # Two one-shot clients run in this stack (store-level and namespace-CLI level);
          # --exit-code-from only tracks one service, so check both explicitly.
          overall_status=0
          for service in client client-ns; do
            container_id=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a -q "${service}")
            exit_code=$(docker inspect "${container_id}" --format '{{.State.ExitCode}}')
            echo "${service} exited with ${exit_code}"
            [ "${exit_code}" = "0" ] || overall_status=1
          done
          exit "${overall_status}"
      - name: Dump logs on failure
        if: failure()
        working-directory: deploy/ipfs
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
      - name: Tear down
        if: always()
        working-directory: deploy/ipfs
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
