name: CI

# Test the solution: static checks + race-enabled unit tests, then a full
# multi-node end-to-end run in containers (authorized round-trip, the
# unauthorized-access checks, and the delete-protection checks) via docker
# compose.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: vet, build & test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Reads the `go 1.26` directive from go.mod so CI tracks the module.
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

  e2e:
    name: multi-node end-to-end (compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # docker compose reads SEED_ADDR for variable substitution; template.env
      # holds the value matching the committed dev seed key (deploy/seed.key).
      - name: Provision compose env
        run: cp template.env .env

      # Authorized client: stores a file, asserts every node received shards,
      # retrieves it, and checks it is byte-identical. Its exit code is the run's.
      - name: Authorized round-trip
        run: docker compose up --build --abort-on-container-exit --exit-code-from client

      - name: Reset network state
        run: docker compose down -v

      # Unauthorized client: separate client that must be denied on every path
      # (no capability, a cap wrapped for a third party, raw shards on disk). It
      # pulls in the nodes and waits for `client` to finish, then asserts denial.
      - name: Unauthorized-access checks
        run: docker compose run --build --rm attacker

      # Delete-protection: a non-owner holding the read-cap is refused when
      # deleting (file survives); the owner then deletes successfully.
      - name: Delete-protection checks
        run: docker compose run --build --rm deleter

      - name: Tear down
        if: always()
        run: docker compose down -v

  resilience:
    name: node-down resilience (compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Stores a file across all 3 nodes, stops one node, then proves the file
      # is still retrieved byte-identically from the surviving k=4 of 6 shards.
      # The script provisions .env, drives compose, and cleans up after itself.
      - name: Store, drop a node, retrieve
        run: ./deploy/resilience.sh

  repair:
    name: autonomous repair (compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Stores a file across the nodes (each shard carrying a stripe descriptor
      # + repair grant), stops one node, waits for a surviving node's repair loop,
      # and proves a lost shard is regenerated onto a survivor that lacked it with
      # no client online — then retrieves the file. Self-contained; cleans up.
      - name: Store, drop a node, repair, retrieve
        run: ./deploy/repair.sh
