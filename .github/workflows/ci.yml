name: CI

# Test the solution: static checks + race-enabled unit tests, then a full
# multi-node end-to-end run in containers (authorized round-trip, the
# unauthorized-access checks, the delete-protection checks, a directory-tree
# round-trip that also exercises DHT root publication and revocation, and a
# multi-device write-reconciliation run) via docker compose. On a version tag
# (v1.2.3), and only after every test job above is green, the `publish` job
# pushes the container images to GHCR — a green-tests gate on every release.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: vet, build & test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Reads the `go 1.26` directive from go.mod so CI tracks the module.
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

  e2e:
    name: multi-node end-to-end (compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # No committed seed key (issue #13): mint an ephemeral, git-ignored dev
      # identity per run and derive the SEED_ADDR the peers bootstrap through.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Generate ephemeral dev seed identity
        run: echo "SEED_ADDR=$(./deploy/gen-seed-key.sh)" >> "$GITHUB_ENV"

      # Authorized client: stores a file, asserts every node received shards,
      # retrieves it, and checks it is byte-identical. Its exit code is the run's.
      - name: Authorized round-trip
        run: docker compose up --build --abort-on-container-exit --exit-code-from client

      - name: Reset network state
        run: docker compose down -v

      # Unauthorized client: separate client that must be denied on every path
      # (no capability, a cap wrapped for a third party, raw shards on disk). It
      # pulls in the nodes and waits for `client` to finish, then asserts denial.
      - name: Unauthorized-access checks
        run: docker compose run --build --rm attacker

      # Delete-protection: a non-owner holding the read-cap is refused when
      # deleting (file survives); the owner then deletes successfully.
      - name: Delete-protection checks
        run: docker compose run --build --rm deleter

      # Directory tree round-trip that also exercises the mutable-namespace path:
      # stores a nested tree spread across all nodes, restores it byte-identically,
      # shares a single file and a subtree (each sealed to the recipient's key),
      # resolves the OWNER's root PUBLISHED to the DHT via `ls -owner`, then revokes
      # a shared subtree (advancing the published seq + orphaning the shared cap).
      - name: Directory tree, DHT publish & revocation round-trip
        run: docker compose run --build --rm tree

      # Multi-device write reconciliation (Architecture §3.7.1): two devices of one
      # User share the owner signing key but separate workspaces; each commit runs
      # the read-merge-publish loop (sealed self-root companion + manifest.Merge3).
      # Disjoint writes must converge with no lost update; a same-path collision
      # must yield a conflict copy keeping both versions.
      - name: Multi-device write reconciliation
        run: docker compose run --build --rm race

      - name: Tear down
        if: always()
        run: docker compose down -v

  resilience:
    name: node-down resilience (compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Generate ephemeral dev seed identity
        run: echo "SEED_ADDR=$(./deploy/gen-seed-key.sh)" >> "$GITHUB_ENV"

      # Stores a file across all 3 nodes, stops one node, then proves the file
      # is still retrieved byte-identically from the surviving k=4 of 6 shards.
      # The script drives compose and cleans up after itself.
      - name: Store, drop a node, retrieve
        run: ./deploy/resilience.sh

  repair:
    name: autonomous repair (compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Generate ephemeral dev seed identity
        run: echo "SEED_ADDR=$(./deploy/gen-seed-key.sh)" >> "$GITHUB_ENV"

      # Stores a file across the nodes (each shard carrying a stripe descriptor
      # + repair grant), stops one node, waits for a surviving node's repair loop,
      # and proves a lost shard is regenerated onto a survivor that lacked it with
      # no client online — then retrieves the file. Self-contained; cleans up.
      - name: Store, drop a node, repair, retrieve
        run: ./deploy/repair.sh

  publish:
    name: publish images (GHCR)
    runs-on: ubuntu-latest
    # Gate on every test job: an image is pushed only if the whole test suite
    # (unit + all four compose end-to-end runs + resilience + repair) is green.
    needs: [test, e2e, resilience, repair]
    # Push only on a version tag (v1.2.3). On branch/PR pushes the job still
    # builds the multi-arch image to validate the Dockerfile, but never pushes.
    permissions:
      contents: read
      packages: write
    # Only the headless storage Node is published here; the revika-ctl client
    # image is intentionally not built by this workflow.
    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx enable multi-arch builds; the Dockerfile cross-compiles
      # the Go binary per target arch, so this stays fast (no emulated builds).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Log in only when we intend to push — i.e. on a version tag.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/revika-node
          # Tag-only publishing: derive the semver tags from the git tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # latest=auto tags `latest` on a semver tag.
          flavor: |
            latest=auto

      # Build metadata stamped into the binary and shown in the node's startup
      # logs. VERSION is metadata-action's derived version (the semver tag);
      # BUILD_DATE is the UTC build time.
      - name: Derive build metadata
        id: build
        run: |
          echo "version=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: node   # headless storage Node only
          platforms: linux/amd64,linux/arm64
          # Push only on a version tag; otherwise build-only (validation).
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=revika-node
          cache-to: type=gha,mode=max,scope=revika-node
