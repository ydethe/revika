name: MITRE Att&ck IDs

# Validate that every framework ID cited in the security/ threat model exists in
# its official knowledge base: MITRE ATT&CK techniques, MITRE D3FEND defensive
# techniques, and NIST SP 800-53 Rev 5 controls. Guards against typos and IDs the
# upstream catalogs have dropped, keeping the fiches trustworthy.
on:
  push:
    branches: [main]
    paths:
      - 'security/**'
      - 'tools/check_attack_ids.py'
      - 'tools/requirements.txt'
      - '.github/workflows/attack-ids.yml'
  pull_request:
    branches: [main]
    paths:
      - 'security/**'
      - 'tools/check_attack_ids.py'
      - 'tools/requirements.txt'
      - '.github/workflows/attack-ids.yml'
  workflow_dispatch:

concurrency:
  group: attack-ids-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate framework IDs in security/
    runs-on: ubuntu-latest
    env:
      FRAMEWORK_DATA_DIR: tools/.frameworks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install mitreattack-python
        run: pip install -r tools/requirements.txt

      - name: Download framework datasets
        run: |
          mkdir -p "$FRAMEWORK_DATA_DIR"
          # Pin ATT&CK to v16.1 (not latest): fetch the versioned bundle, saved
          # under the unversioned name check_attack_ids.py expects. The script
          # verifies each bundle's x-mitre-collection version is 16.1.
          base=https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master
          for m in enterprise mobile ics; do
            curl -fsSL "$base/$m-attack/$m-attack-16.1.json" -o "$FRAMEWORK_DATA_DIR/$m-attack.json"
          done
          curl -fsSL https://d3fend.mitre.org/ontologies/d3fend.json \
            -o "$FRAMEWORK_DATA_DIR/d3fend.json"
          curl -fsSL https://raw.githubusercontent.com/usnistgov/oscal-content/main/nist.gov/SP800-53/rev5/json/NIST_SP-800-53_rev5_catalog.json \
            -o "$FRAMEWORK_DATA_DIR/nist-sp800-53-rev5.json"

      - name: Validate framework IDs
        run: python tools/check_attack_ids.py
