# A self-contained, local revika network for multi-node testing:
#
#   seed  ── node2, node3 bootstrap through it ──┐
#     ▲                                          │
#     └──────────── client (put/get + verify) ───┘
#
# A node's Peer ID is derived from its libp2p identity key, so bootstrapping
# normally needs a two-step "start seed, copy its Peer ID" dance. We skip that
# here by giving the seed a *fixed, committed dev-only identity* (deploy/seed.key,
# bind-mounted read-only). Its Peer ID is therefore known ahead of time and baked
# into SEED_ADDR below — the whole network comes up with a single command:
#
#   docker compose up --build
#
# The `client` service then stores a random file (spreading its erasure-coded
# shards across all three nodes), asserts every node received shards, retrieves
# it, and checks it is byte-identical. It exits 0 on success, non-zero on
# failure, so the run's outcome is visible via the client's exit code:
#
#   docker compose up --build --abort-on-container-exit --exit-code-from client
#
# The `attacker` service is a SEPARATE client that verifies the security model:
# holding only what a real adversary could get (full DHT access, read access to
# every node's raw shards, and a capability wrapped for someone ELSE), it must be
# denied on every path. It is gated behind the `attack` compose profile so the
# authorized run above does not start it. Run it after — it pulls in the nodes
# and waits for `client` to finish storing (which hands it the artifacts):
#
#   docker compose run --build --rm attacker
#
# The `deleter` service (profile `delete`) verifies the authorization model: a
# user holding the read-cap but not the owner's signing key is refused when
# deleting, while the owner succeeds. It is self-contained (needs only the nodes):
#
#   docker compose run --build --rm deleter
#
# These runs share one seed/nodes network; tear it down with:
#
#   docker compose down -v
#
# WARNING: deploy/seed.key is a well-known key checked into the repo purely so
# this local setup is reproducible. Never use it for a real deployment.

# The seed's dial address, referenced ONCE here (a YAML anchor) and taken from
# the SEED_ADDR environment variable — never hardcoded and never from a .env
# file. In CI it is injected from the `SEED_ADDR` GitHub Actions secret; for a
# local run, export it first (its Peer ID is derived from the committed dev-only
# key deploy/seed.key and printed by the seed on startup, `docker compose logs
# seed`). Peers reference it as `*seed_addr`.
x-seed-addr: &seed_addr "${SEED_ADDR:?SEED_ADDR must be set (CI: the SEED_ADDR secret; local: export it)}"

services:
  # Entry point of the network: no -bootstrap, others join through it. Its
  # identity is pinned by the bind-mounted key so its Peer ID is stable and
  # known in advance (it is baked into SEED_ADDR for the peers and client).
  seed:
    build:
      context: .
      target: node
    image: revika-node
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -listen=/ip4/0.0.0.0/udp/4001/quic-v1
      - -mdns=false
      # Repair cadence; shortened by deploy/repair.sh via REPAIR_INTERVAL, else 1h.
      - -repair-interval=${REPAIR_INTERVAL:-1h}
    volumes:
      - ./deploy/seed.key:/data/keys/node.key:ro
      - seed-data:/data
    ports:
      - "4001:4001"       # TCP, published so host-side clients can bootstrap too
      - "4001:4001/udp"   # QUIC

  node2:
    build:
      context: .
      target: node
    image: revika-node
    depends_on: [seed]
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -listen=/ip4/0.0.0.0/udp/4001/quic-v1
      - -mdns=false
      - -bootstrap
      - *seed_addr
      - -repair-interval=${REPAIR_INTERVAL:-1h}
    volumes:
      - node2-data:/data

  node3:
    build:
      context: .
      target: node
    image: revika-node
    depends_on: [seed]
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -listen=/ip4/0.0.0.0/udp/4001/quic-v1
      - -mdns=false
      - -bootstrap
      - *seed_addr
      - -repair-interval=${REPAIR_INTERVAL:-1h}
    volumes:
      - node3-data:/data

  # Spare nodes for the autonomous-repair scenario (profile: repair). They give a
  # survivor an obviously-fresh target to re-place a downed node's shards onto and
  # cut colocation, so k+m=6 shards spread across more failure domains. Gated
  # behind the repair profile so the other scenarios keep their 3-node topology.
  node4:
    profiles: ["repair"]
    build:
      context: .
      target: node
    image: revika-node
    depends_on: [seed]
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -listen=/ip4/0.0.0.0/udp/4001/quic-v1
      - -mdns=false
      - -bootstrap
      - *seed_addr
      - -repair-interval=${REPAIR_INTERVAL:-1h}
    volumes:
      - node4-data:/data

  node5:
    profiles: ["repair"]
    build:
      context: .
      target: node
    image: revika-node
    depends_on: [seed]
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -listen=/ip4/0.0.0.0/udp/4001/quic-v1
      - -mdns=false
      - -bootstrap
      - *seed_addr
      - -repair-interval=${REPAIR_INTERVAL:-1h}
    volumes:
      - node5-data:/data

  # One-shot User client: joins the DHT through the seed, stores a file (shards
  # spread across the nodes), verifies every node got shards, and retrieves it.
  # The node data volumes are mounted read-only so the script can count each
  # node's on-disk shards directly.
  client:
    build:
      context: .
      target: client
    image: revika-ctl
    depends_on: [seed, node2, node3]
    environment:
      SEED_ADDR: *seed_addr
    volumes:
      - seed-data:/nodes/seed:ro
      - node2-data:/nodes/node2:ro
      - node3-data:/nodes/node3:ro
      # rw: after the round-trip, verify.sh drops artifacts here for the attacker
      # (a cap wrapped for a third party + the plaintext canary — never the keys).
      - handoff:/handoff
    restart: "no"

  # A separate, unauthorized client. It reuses the same image (target: client)
  # but runs attack.sh instead of verify.sh. It waits for `client` to finish
  # storing, then holds exactly what a real attacker could obtain — DHT access,
  # read-only view of every node's shards, and a cap wrapped for a THIRD party —
  # and asserts it is denied on every path (exits 0 only if all attempts fail).
  # Gated behind the `attack` profile so plain `up` skips it; start it with
  # `docker compose run --build --rm attacker`.
  attacker:
    profiles: ["attack"]
    build:
      context: .
      target: client
    image: revika-ctl
    entrypoint: ["/usr/local/bin/attack.sh"]
    depends_on:
      seed:
        condition: service_started
      node2:
        condition: service_started
      node3:
        condition: service_started
      client:
        condition: service_completed_successfully
    environment:
      SEED_ADDR: *seed_addr
    volumes:
      - seed-data:/nodes/seed:ro
      - node2-data:/nodes/node2:ro
      - node3-data:/nodes/node3:ro
      - handoff:/handoff:ro
    restart: "no"

  # Delete-protection client (profile: delete). A self-contained scenario driven
  # by deploy/delete-protection.sh proving revika's authorization model: an
  # "owner" stores a file, a DIFFERENT user holding the read-cap but not the
  # owner's signing key is REFUSED when deleting it (and the file survives), and
  # then the owner deletes successfully (and the file becomes unrecoverable). It
  # only needs the nodes up; run it with:
  #   docker compose run --build --rm deleter
  deleter:
    profiles: ["delete"]
    build:
      context: .
      target: client
    image: revika-ctl
    entrypoint: ["/usr/local/bin/delete-protection.sh"]
    depends_on:
      seed:
        condition: service_started
      node2:
        condition: service_started
      node3:
        condition: service_started
    environment:
      SEED_ADDR: *seed_addr
    restart: "no"

  # --- node-down resilience scenario (profile: resilience) -------------------
  # Two one-shot clients driven by deploy/resilience.sh, which stops a node
  # between them to prove erasure-coded durability: store spreads 6 shards
  # 2-per-node, one node is taken down, and get still rebuilds the file from the
  # surviving k=4 shards. Do not run these directly — run the orchestrator:
  #   ./deploy/resilience.sh
  # (it brings the nodes up, runs `store`, stops a node, then runs `retrieve`).

  # Stores the file and leaves the source + manifest on the handoff volume.
  store:
    profiles: ["resilience"]
    build:
      context: .
      target: client
    image: revika-ctl
    entrypoint: ["/usr/local/bin/resilience-client.sh"]
    command: ["store"]
    depends_on:
      seed:
        condition: service_started
      node2:
        condition: service_started
      node3:
        condition: service_started
    environment:
      SEED_ADDR: *seed_addr
    volumes:
      - handoff:/handoff
    restart: "no"

  # Retrieves the file from the handoff manifest while a node is down. It depends
  # ONLY on the seed (its bootstrap) — deliberately NOT on node2/node3, so that
  # `docker compose run retrieve` does not restart the node the orchestrator just
  # stopped.
  retrieve:
    profiles: ["resilience"]
    build:
      context: .
      target: client
    image: revika-ctl
    entrypoint: ["/usr/local/bin/resilience-client.sh"]
    command: ["get"]
    depends_on:
      seed:
        condition: service_started
    environment:
      SEED_ADDR: *seed_addr
    volumes:
      - handoff:/handoff:ro
    restart: "no"

  # --- autonomous repair scenario (profile: repair) --------------------------
  # Two one-shot clients driven by deploy/repair.sh, which stops a node between
  # them to prove node-side repair: `store` spreads shards (each carrying a stripe
  # descriptor + repair grant), a node is taken down, a *surviving* node
  # regenerates the lost shards onto a node that lacked them with no client
  # online, and `get` rebuilds the file. Do not run these directly — run:
  #   ./deploy/repair.sh

  # Pre-failure step: stores the file and snapshots each node's shard set. Mounts
  # every node's data read-only so it can record the baseline shard sets; depends
  # on all nodes (they must be up to receive shards).
  repair-pre:
    profiles: ["repair"]
    build:
      context: .
      target: client
    image: revika-ctl
    entrypoint: ["/usr/local/bin/repair-client.sh"]
    depends_on:
      seed:
        condition: service_started
      node2:
        condition: service_started
      node3:
        condition: service_started
    environment:
      SEED_ADDR: *seed_addr
      DOWN_NODE: ${DOWN_NODE:-node3}
    volumes:
      - seed-data:/nodes/seed:ro
      - node2-data:/nodes/node2:ro
      - node3-data:/nodes/node3:ro
      - node4-data:/nodes/node4:ro
      - node5-data:/nodes/node5:ro
      - handoff:/handoff
    restart: "no"

  # Post-failure step: verifies a lost shard was regenerated onto a survivor, then
  # retrieves the file. Depends ONLY on the seed (its bootstrap) so running it does
  # NOT restart the node the orchestrator just stopped; it still mounts every
  # node's data read-only to inspect the survivors' current shard sets.
  repair-post:
    profiles: ["repair"]
    build:
      context: .
      target: client
    image: revika-ctl
    entrypoint: ["/usr/local/bin/repair-client.sh"]
    depends_on:
      seed:
        condition: service_started
    environment:
      SEED_ADDR: *seed_addr
      DOWN_NODE: ${DOWN_NODE:-node3}
    volumes:
      - seed-data:/nodes/seed:ro
      - node2-data:/nodes/node2:ro
      - node3-data:/nodes/node3:ro
      - node4-data:/nodes/node4:ro
      - node5-data:/nodes/node5:ro
      - handoff:/handoff
    restart: "no"

volumes:
  seed-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
  handoff:
