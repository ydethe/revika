# A self-contained, local revika network for multi-node testing:
#
#   seed  ── node2, node3 bootstrap through it ──┐
#     ▲                                          │
#     └──────────── client (put/get + verify) ───┘
#
# A node's Peer ID is derived from its libp2p identity key, so bootstrapping
# normally needs a two-step "start seed, copy its Peer ID" dance. We skip that
# here by giving the seed a *fixed, committed dev-only identity* (deploy/seed.key,
# bind-mounted read-only). Its Peer ID is therefore known ahead of time and baked
# into SEED_ADDR below — the whole network comes up with a single command:
#
#   docker compose up --build
#
# The `client` service then stores a random file (spreading its erasure-coded
# shards across all three nodes), asserts every node received shards, retrieves
# it, and checks it is byte-identical. It exits 0 on success, non-zero on
# failure, so the run's outcome is visible via the client's exit code:
#
#   docker compose up --build --abort-on-container-exit --exit-code-from client
#
# WARNING: deploy/seed.key is a well-known key checked into the repo purely so
# this local setup is reproducible. Never use it for a real deployment.

services:
  # Entry point of the network: no -bootstrap, others join through it. Its
  # identity is pinned by the bind-mounted key so its Peer ID is stable and
  # known in advance (it is baked into SEED_ADDR for the peers and client).
  seed:
    build:
      context: .
      target: node
    image: revika-node
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -listen=/ip4/0.0.0.0/udp/4001/quic-v1
      - -mdns=false
    volumes:
      - ./deploy/seed.key:/data/keys/node.key:ro
      - seed-data:/data
    ports:
      - "4001:4001"       # TCP, published so host-side clients can bootstrap too
      - "4001:4001/udp"   # QUIC

  node2:
    build:
      context: .
      target: node
    image: revika-node
    depends_on: [seed]
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -listen=/ip4/0.0.0.0/udp/4001/quic-v1
      - -mdns=false
      - -bootstrap=${SEED_ADDR}
    volumes:
      - node2-data:/data

  node3:
    build:
      context: .
      target: node
    image: revika-node
    depends_on: [seed]
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -listen=/ip4/0.0.0.0/udp/4001/quic-v1
      - -mdns=false
      - -bootstrap=${SEED_ADDR}
    volumes:
      - node3-data:/data

  # One-shot User client: joins the DHT through the seed, stores a file (shards
  # spread across the nodes), verifies every node got shards, and retrieves it.
  # The node data volumes are mounted read-only so the script can count each
  # node's on-disk shards directly.
  client:
    build:
      context: .
      target: client
    image: revika-ctl
    depends_on: [seed, node2, node3]
    environment:
      SEED_ADDR: ${SEED_ADDR}
    volumes:
      - seed-data:/nodes/seed:ro
      - node2-data:/nodes/node2:ro
      - node3-data:/nodes/node3:ro
    restart: "no"

volumes:
  seed-data:
  node2-data:
  node3-data:
