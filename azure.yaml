# Deploy the prebuilt public revika-node image (ghcr.io/ydethe/revika-node) to
# Azure Container Apps.
#
# This is an INFRA-ONLY azd project: infra/main.bicep fully declares the
# container app and pulls the published GHCR image, so azd never builds or
# pushes a container itself (no local Docker required).
#
# Set the deployment inputs before `azd up`:
#   azd env set SEED_ADDR <your-seed-multiaddr>   # DHT bootstrap peer (required)
#   azd env set PUBLIC_IP <node-public-ip>        # advertised public IP (optional)
name: revika-node
metadata:
  template: revika-node@0.0.1
infra:
  provider: bicep
  path: infra
