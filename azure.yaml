# Deploy the prebuilt public revika-node image (ghcr.io/ydethe/revika-node) to
# Azure Container Apps.
#
# This is an INFRA-ONLY azd project: infra/main.bicep fully declares the
# container app and pulls the published GHCR image, so azd never builds or
# pushes a container itself (no local Docker required).
#
# Set the deployment inputs before `azd up`:
#   azd env set SEED_ADDR <your-seed-multiaddr>   # DHT bootstrap peer (required)
#   azd env set PUBLIC_IP <node-public-ip>        # advertised public IP (optional)
#
# The node's ownership/lease/quota ledger lives in an Azure Database for
# PostgreSQL flexible server (`-ledger-driver=postgres -ledger-dsn=...`), reachable
# only over the VNet's delegated subnet + private DNS zone. There is NO file share
# (no SMB, no NFS): /data is the container's ephemeral disk and holds only shard
# blobs and the libp2p identity, both re-created on restart. The admin password is
# generated by azd on first provision (`$(secretOrRandomPassword)`); override the
# login with `azd env set POSTGRES_ADMIN_USER <name>`.
#
# Because PostgreSQL accepts concurrent writers, a rolling redeploy no longer
# deadlocks the ledger the way single-writer SQLite on a shared mount did.
name: revika-node
metadata:
  template: revika-node@0.0.1
infra:
  provider: bicep
  path: infra
